<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saimart - Checkout</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f5f5;
        }

        .navbar {
            background: #131921;
            color: white;
            padding: 16px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .checkout-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .order-summary {
            background: #f8f8f8;
            padding: 20px;
            border-radius: 8px;
            margin-top: 25px;
        }

        .summary-item {
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .total {
            font-size: 24px;
            font-weight: bold;
            margin-top: 15px;
        }

        .place-order {
            margin-top: 25px;
            background: #ff9900;
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .place-order:hover {
            background: #e68a00;
        }

        .back-cart {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #0073bb;
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <strong>Saimart</strong>

        <div>
            <a href="/products">Products</a>
            <a href="/cart">Cart</a>
            <a href="/login">Logout</a>
        </div>

    </nav>


    <div class="container">

        <div class="checkout-box">

            <h1>🛍️ Checkout</h1>


            <form id="checkoutForm">

                <h2>Delivery Information</h2>


                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required>

                </div>


                <div class="form-group">

                    <label>Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required>

                </div>


                <div class="form-group">

                    <label>Address</label>

                    <textarea
                        id="address"
                        placeholder="Enter your full address"
                        required></textarea>

                </div>


                <div class="form-group">

                    <label>City</label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Enter your city"
                        required>

                </div>


                <div class="form-group">

                    <label>Pincode</label>

                    <input
                        type="text"
                        id="pincode"
                        placeholder="Enter pincode"
                        required>

                </div>


                <h2>Payment Method</h2>


                <div class="form-group">

                    <select id="paymentMethod">

                        <option value="COD">
                            Cash on Delivery
                        </option>

                    </select>

                </div>


                <div class="order-summary">

                    <h2>Order Summary</h2>

                    <div id="items"></div>

                    <div
                        class="total"
                        id="total">
                        Total: ₹0
                    </div>

                </div>


                <button
                    type="submit"
                    class="place-order">

                    Place Order

                </button>


                <br>

                <a
                    href="/cart"
                    class="back-cart">
                    ← Back to Cart
                </a>

            </form>

        </div>

    </div>


    <script>

        /*
         * Get logged-in buyer
         */

        const user =
            JSON.parse(
                localStorage.getItem("saimartUser")
            );


        /*
         * Get cart
         */

        let cart =
            JSON.parse(
                localStorage.getItem("saimartCart")
            ) || [];


        /*
         * Make sure user is logged in
         */

        if (!user) {

            alert("Please login before checkout.");

            window.location.href =
                "/login";

        }


        /*
         * Display order summary
         */

        function loadOrderSummary() {

            const itemsElement =
                document.getElementById("items");

            const totalElement =
                document.getElementById("total");


            if (cart.length === 0) {

                itemsElement.innerHTML =
                    "<p>Your cart is empty.</p>";

                totalElement.innerHTML =
                    "Total: ₹0";

                return;

            }


            let total = 0;

            let html = "";


            cart.forEach(item => {

                const itemTotal =
                    item.price * item.quantity;

                total += itemTotal;


                html += `

                    <div class="summary-item">

                        <strong>
                            ${item.name}
                        </strong>

                        <br>

                        Quantity:
                        ${item.quantity}

                        <br>

                        Price:
                        ₹${item.price}

                        <br>

                        Item Total:
                        ₹${itemTotal}

                    </div>

                `;

            });


            itemsElement.innerHTML =
                html;


            totalElement.innerHTML =
                "Total: ₹" + total;

        }


        /*
         * Place order
         */

        document
            .getElementById("checkoutForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    /*
                     * Check cart
                     */

                    if (cart.length === 0) {

                        alert(
                            "Your cart is empty!"
                        );

                        return;

                    }


                    /*
                     * Check login
                     */

                    if (!user) {

                        alert(
                            "Please login before placing an order."
                        );

                        window.location.href =
                            "/login";

                        return;

                    }


                    /*
                     * Create order
                     */

                    const order = {

                        buyerId:
                            user.id,


                        fullName:
                            document
                                .getElementById(
                                    "fullName"
                                )
                                .value,


                        phone:
                            document
                                .getElementById(
                                    "phone"
                                )
                                .value,


                        address:
                            document
                                .getElementById(
                                    "address"
                                )
                                .value,


                        city:
                            document
                                .getElementById(
                                    "city"
                                )
                                .value,


                        pincode:
                            document
                                .getElementById(
                                    "pincode"
                                )
                                .value,


                        paymentMethod:
                            document
                                .getElementById(
                                    "paymentMethod"
                                )
                                .value,


                        total:
                            cart.reduce(
                                (sum, item) =>
                                    sum +
                                    item.price *
                                    item.quantity,
                                0
                            ),


                        orderDate:
                            new Date()
                                .toLocaleString(),


                        /*
                         * IMPORTANT:
                         * Send every cart product
                         * as an OrderItem.
                         */

                        items:
                            cart.map(item => ({

                                productId:
                                    item.id,

                                sellerId:
                                    item.sellerId,

                                productName:
                                    item.name,

                                price:
                                    item.price,

                                quantity:
                                    item.quantity

                            }))

                    };


                    console.log(
                        "Order being sent:",
                        order
                    );


                    try {

                        const response =
                            await fetch(
                                "/api/orders",
                                {

                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(
                                            order
                                        )

                                }
                            );


                        if (!response.ok) {

                            throw new Error(
                                "Order could not be saved"
                            );

                        }


                        /*
                         * Backend saved order
                         */

                        const savedOrder =
                            await response.json();


                        /*
                         * Save last order ID
                         */

                        localStorage.setItem(
                            "saimartLastOrderId",
                            savedOrder.id
                        );


                        /*
                         * Save order locally
                         * for order-success page
                         */

                        localStorage.setItem(
                            "saimartOrder",
                            JSON.stringify({

                                ...savedOrder,

                                items: cart

                            })
                        );


                        /*
                         * Clear cart
                         */

                        localStorage.removeItem(
                            "saimartCart"
                        );


                        /*
                         * Go to success page
                         */

                        window.location.href =
                            "/order-success";


                    } catch (error) {

                        console.error(
                            "Order error:",
                            error
                        );

                        alert(
                            "Something went wrong while placing the order."
                        );

                    }

                }
            );


        /*
         * Load summary
         */

        loadOrderSummary();

    </script>

</body>

</html>
