<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — Saimart</title>
    <link rel="stylesheet" href="/css/saimart.css">
    <style>
        .checkout-wrapper {
            max-width: 1100px;
            margin: 40px auto 70px;
            padding: 0 20px;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 30px;
            align-items: start;
        }

        .card-box {
            background: white;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            padding: 28px;
            box-shadow: var(--shadow-sm);
        }

        .card-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-full {
            grid-column: span 2;
        }

        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }
        .form-group textarea {
            height: 80px;
            resize: vertical;
        }

        .payment-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }
        .payment-card-opt {
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
        }
        .payment-card-opt:hover {
            border-color: var(--accent);
            background: #fffbeb;
        }
        .payment-card-opt.selected {
            border-color: var(--accent);
            background: #fef3c7;
        }
        .payment-card-opt input {
            accent-color: var(--accent-hover);
        }

        .checkout-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 280px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 4px;
        }
        .checkout-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .cost-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 10px;
            color: #475569;
        }
        .cost-total {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
            padding-top: 14px;
            border-top: 2px dashed var(--border-color);
            margin-top: 14px;
            margin-bottom: 24px;
        }

        @media (max-width: 900px) {
            .checkout-grid {
                grid-template-columns: 1fr;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-full {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <!-- UNIVERSAL NAVBAR -->
    <header class="saimart-nav">
        <div class="saimart-nav-inner">
            <a href="/" class="nav-brand">
                <span class="nav-brand-logo">SAIMART</span>
                <span class="nav-brand-badge">Checkout</span>
            </a>

            <div class="nav-actions" style="margin-left: auto;">
                <a href="/cart" class="nav-link">← Back to Cart</a>
            </div>
        </div>
    </header>

    <div class="checkout-wrapper">
        <div class="checkout-grid">
            <!-- Left Column: Form -->
            <form id="checkoutForm" onsubmit="handlePlaceOrder(event)">
                <div class="card-box" style="margin-bottom: 24px;">
                    <div class="card-title">
                        <span>📍</span> Delivery Address
                    </div>
                    <div class="form-grid">
                        <div class="form-group form-full">
                            <label>Full Name *</label>
                            <input type="text" id="fullName" placeholder="Recipient's full name" required>
                        </div>
                        <div class="form-group">
                            <label>Phone Number *</label>
                            <input type="tel" id="phone" placeholder="10-digit mobile number" required pattern="[0-9]{10}">
                        </div>
                        <div class="form-group">
                            <label>Postal Code / Pincode *</label>
                            <input type="text" id="pincode" placeholder="6-digit PIN" required pattern="[0-9]{6}">
                        </div>
                        <div class="form-group form-full">
                            <label>Street Address / House No. *</label>
                            <textarea id="address" placeholder="Flat, building, area, street" required></textarea>
                        </div>
                        <div class="form-group form-full">
                            <label>City & State *</label>
                            <input type="text" id="city" placeholder="e.g. Chennai, Tamil Nadu" required>
                        </div>
                    </div>
                </div>

                <div class="card-box">
                    <div class="card-title">
                        <span>💳</span> Payment Method
                    </div>
                    <div class="payment-options">
                        <label class="payment-card-opt selected" id="optCOD">
                            <input type="radio" name="paymentMethod" value="COD" checked onclick="selectPayment('COD')">
                            <div>
                                <strong>Cash on Delivery (COD)</strong>
                                <p style="font-size: 12px; color: var(--text-muted); margin: 0;">Pay in cash or UPI upon delivery at your doorstep.</p>
                            </div>
                        </label>
                        <label class="payment-card-opt" id="optUPI">
                            <input type="radio" name="paymentMethod" value="UPI / Instant" onclick="selectPayment('UPI / Instant')">
                            <div>
                                <strong>UPI / Digital Payment (Instant)</strong>
                                <p style="font-size: 12px; color: var(--text-muted); margin: 0;">Instant confirmation for demo presentation.</p>
                            </div>
                        </label>
                    </div>
                </div>

                <div style="margin-top: 24px;">
                    <button type="submit" id="btnPlaceOrder" class="btn btn-primary" style="width: 100%; padding: 15px; font-size: 16px;">
                        🛍️ Confirm & Place Order
                    </button>
                </div>
            </form>

            <!-- Right Column: Summary -->
            <div class="card-box">
                <div class="card-title">
                    <span>📦</span> Items in Order
                </div>
                <div class="checkout-items" id="checkoutItemsList"></div>

                <div class="cost-row">
                    <span>Subtotal</span>
                    <span id="summarySubtotal">₹0</span>
                </div>
                <div class="cost-row">
                    <span>Delivery Fee</span>
                    <span style="color: var(--success); font-weight: 700;">FREE</span>
                </div>
                <div class="cost-row">
                    <span>Taxes</span>
                    <span>Included</span>
                </div>
                <div class="cost-total">
                    <span>Total Amount</span>
                    <span id="summaryTotal" style="color: var(--accent-hover);">₹0</span>
                </div>

                <div style="background: #f8fafc; border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 12px; font-size: 12px; color: var(--text-muted);">
                    🔒 <strong>100% Purchase Protection</strong><br>
                    Real-time stock deduction and immediate dispatch tracking.
                </div>
            </div>
        </div>
    </div>

    <!-- SHARED JS CLIENT -->
    <script src="/js/saimart.js"></script>

    <script>
        let cart = [];
        let user = null;

        function initCheckout() {
            user = getUser();
            if (!user) {
                showToast("Please login before checkout", "warning");
                setTimeout(() => {
                    window.location.href = "/login?redirect=/checkout";
                }, 500);
                return;
            }

            cart = getCart();
            if (!cart || cart.length === 0) {
                showToast("Your cart is empty!", "info");
                setTimeout(() => {
                    window.location.href = "/products";
                }, 500);
                return;
            }

            // Autofill user details
            if (user.name) document.getElementById("fullName").value = user.name;

            // Render items
            let total = 0;
            const container = document.getElementById("checkoutItemsList");
            container.innerHTML = "";

            cart.forEach(item => {
                const itemTotal = Number(item.price) * Number(item.quantity);
                total += itemTotal;

                const row = document.createElement("div");
                row.className = "checkout-item-row";
                row.innerHTML = `
                    <div>
                        <strong>${escapeHTML(item.name)}</strong>
                        <div style="font-size: 12px; color: var(--text-muted);">Qty: ${item.quantity} × ₹${Number(item.price).toLocaleString("en-IN")}</div>
                    </div>
                    <div style="font-weight: 700;">₹${itemTotal.toLocaleString("en-IN")}</div>
                `;
                container.appendChild(row);
            });

            document.getElementById("summarySubtotal").innerText = "₹" + total.toLocaleString("en-IN");
            document.getElementById("summaryTotal").innerText = "₹" + total.toLocaleString("en-IN");
        }

        function selectPayment(val) {
            document.getElementById("optCOD").classList.toggle("selected", val === "COD");
            document.getElementById("optUPI").classList.toggle("selected", val !== "COD");
        }

        async function handlePlaceOrder(e) {
            e.preventDefault();

            if (!cart || cart.length === 0) {
                showToast("Your cart is empty!", "error");
                return;
            }

            const btn = document.getElementById("btnPlaceOrder");
            btn.disabled = true;
            btn.innerText = "Processing Order...";

            const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;

            const orderPayload = {
                buyerId: (user && user.id) ? user.id : 1,
                fullName: document.getElementById("fullName").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                address: document.getElementById("address").value.trim(),
                city: document.getElementById("city").value.trim(),
                pincode: document.getElementById("pincode").value.trim(),
                paymentMethod: paymentMethod,
                total: cart.reduce((sum, i) => sum + (Number(i.price) * Number(i.quantity)), 0),
                status: "PLACED",
                items: cart.map(item => ({
                    productId: item.id,
                    sellerId: item.sellerId || 1, // Fallback safe
                    productName: item.name,
                    price: Number(item.price),
                    quantity: Number(item.quantity)
                }))
            };

            try {
                const res = await fetch("/api/orders", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(orderPayload)
                });

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.error || "Order could not be saved");
                }

                const savedOrder = await res.json();

                // Save last order for receipt & tracking
                localStorage.setItem("saimartLastOrderId", savedOrder.id);
                localStorage.setItem("saimartOrder", JSON.stringify(savedOrder));

                // Clear cart
                saveCart([]);

                showToast("Order placed successfully! 🎉", "success");
                setTimeout(() => {
                    window.location.href = "/order-success";
                }, 600);

            } catch (err) {
                console.error(err);
                showToast(err.message || "Failed to place order. Please try again.", "error");
                btn.disabled = false;
                btn.innerText = "🛍️ Confirm & Place Order";
            }
        }

        document.addEventListener("DOMContentLoaded", initCheckout);
    </script>
</body>
</html>
