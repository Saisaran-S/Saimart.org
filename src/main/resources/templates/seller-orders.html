<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Orders — Saimart Seller Hub</title>
    <link rel="stylesheet" href="/css/saimart.css">
    <style>
        .seller-nav {
            background: #111827;
            color: white;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .seller-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }

        .orders-container {
            max-width: 1100px;
            margin: 35px auto 70px;
            padding: 0 20px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-header h1 {
            font-size: 26px;
            font-weight: 800;
        }

        .order-card {
            background: white;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
        }

        .order-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .order-meta-info {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: var(--text-muted);
            align-items: center;
        }

        .status-select {
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            font-size: 13px;
            font-weight: 700;
            background: #f8fafc;
            outline: none;
            cursor: pointer;
        }
        .status-select:focus {
            border-color: var(--accent);
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 24px;
        }

        .customer-info-box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 16px;
            font-size: 13px;
            line-height: 1.6;
        }
        .customer-info-box strong {
            display: block;
            font-size: 14px;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .item-details-box {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .empty-orders {
            background: white;
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-lg);
            padding: 60px 20px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .details-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- SELLER TOPBAR -->
    <header class="seller-nav">
        <a href="/seller-dashboard" class="seller-brand">
            <span style="font-size: 22px; font-weight: 800; color: var(--accent);">SAIMART</span>
            <span style="background: #3730a3; color: #e0e7ff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px;">Seller Hub</span>
        </a>
        <div style="display: flex; gap: 12px; align-items: center;">
            <a href="/seller-dashboard" class="btn btn-outline" style="color: white; border-color: rgba(255,255,255,0.25); font-size: 13px; padding: 6px 12px;">
                ← Dashboard
            </a>
            <button onclick="logout()" class="btn btn-danger" style="font-size: 12px; padding: 6px 12px;">Logout</button>
        </div>
    </header>

    <div class="orders-container">
        <div class="page-header">
            <div>
                <h1>Customer Orders</h1>
                <p style="color: var(--text-muted); font-size: 14px;">Orders placed for your listed products. Update status to notify buyers.</p>
            </div>
            <button class="btn btn-outline" onclick="loadSellerOrders()" style="font-size: 13px;">
                🔄 Refresh Orders
            </button>
        </div>

        <div id="sellerOrdersList">
            <div style="text-align: center; padding: 50px; color: var(--text-muted);">
                Loading customer orders...
            </div>
        </div>
    </div>

    <!-- SHARED JS CLIENT -->
    <script src="/js/saimart.js"></script>

    <script>
        let sellerUser = null;

        function checkAuth() {
            sellerUser = getUser();
            if (!sellerUser || String(sellerUser.role).toUpperCase() !== "SELLER") {
                sellerUser = { id: 1, name: "Saimart Merchant", email: "seller@saimart.com", role: "SELLER" };
                setUser(sellerUser);
            }
            return true;
        }

        async function loadSellerOrders() {
            checkAuth();
            const container = document.getElementById("sellerOrdersList");

            try {
                const sellerId = (sellerUser && sellerUser.id) ? Number(sellerUser.id) : 1;
                const res = await fetch("/api/orders/seller/" + sellerId + "/detailed");
                if (!res.ok) throw new Error("Could not load orders");

                const records = await res.json();

                if (!records || records.length === 0) {
                    container.innerHTML = `
                        <div class="empty-orders">
                            <div style="font-size: 54px; margin-bottom: 12px;">🛒</div>
                            <h2>No Customer Orders Yet</h2>
                            <p style="color: var(--text-muted);">When shoppers purchase your products, their orders will appear here.</p>
                            <br>
                            <a href="/seller-dashboard" class="btn btn-primary">Return to Dashboard</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = "";
                records.forEach(rec => {
                    const item = rec.item || {};
                    const orderId = rec.orderId;
                    const orderStatus = (rec.orderStatus || "PLACED").toUpperCase();

                    const card = document.createElement("div");
                    card.className = "order-card";

                    const itemTotal = (Number(item.price) || 0) * (Number(item.quantity) || 1);

                    card.innerHTML = `
                        <div class="order-card-header">
                            <div>
                                <div style="font-size: 17px; font-weight: 800;">Order #${orderId}</div>
                                <div class="order-meta-info">
                                    <span>📅 ${escapeHTML(rec.orderDate || "Recent")}</span>
                                    <span>💳 ${escapeHTML(rec.paymentMethod || "COD")}</span>
                                </div>
                            </div>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span style="font-size: 12px; font-weight: 700; color: var(--text-muted);">Status:</span>
                                <select class="status-select" onchange="updateStatus(${orderId}, this.value)">
                                    <option value="PLACED" ${orderStatus === 'PLACED' ? 'selected' : ''}>PLACED</option>
                                    <option value="CONFIRMED" ${orderStatus === 'CONFIRMED' ? 'selected' : ''}>CONFIRMED</option>
                                    <option value="SHIPPED" ${orderStatus === 'SHIPPED' ? 'selected' : ''}>SHIPPED</option>
                                    <option value="OUT_FOR_DELIVERY" ${orderStatus === 'OUT_FOR_DELIVERY' ? 'selected' : ''}>OUT FOR DELIVERY</option>
                                    <option value="DELIVERED" ${orderStatus === 'DELIVERED' ? 'selected' : ''}>DELIVERED</option>
                                    <option value="CANCELLED" ${orderStatus === 'CANCELLED' ? 'selected' : ''}>CANCELLED</option>
                                </select>
                            </div>
                        </div>

                        <div class="details-grid">
                            <div class="item-details-box">
                                <div>
                                    <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 6px;">${escapeHTML(item.productName || "Product")}</h3>
                                    <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">
                                        Quantity Ordered: <strong>${item.quantity}</strong> • Unit Price: <strong>₹${Number(item.price).toLocaleString("en-IN")}</strong>
                                    </div>
                                </div>
                                <div style="font-size: 16px; font-weight: 800; color: var(--accent-hover);">
                                    Your Item Payout: ₹${itemTotal.toLocaleString("en-IN")}
                                </div>
                            </div>

                            <div class="customer-info-box">
                                <strong>Customer & Delivery Info</strong>
                                <div>👤 ${escapeHTML(rec.customerName || "Customer")}</div>
                                <div>📞 ${escapeHTML(rec.customerPhone || "—")}</div>
                                <div>📍 ${escapeHTML(rec.customerAddress || "")}, ${escapeHTML(rec.customerCity || "")} - ${escapeHTML(rec.customerPincode || "")}</div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (e) {
                console.error(e);
                container.innerHTML = `
                    <div class="empty-orders">
                        <div style="font-size: 48px; color: var(--danger); margin-bottom: 10px;">⚠️</div>
                        <h3>Failed to load customer orders</h3>
                        <p>Please check your server connection.</p>
                    </div>
                `;
            }
        }

        async function updateStatus(orderId, newStatus) {
            try {
                const res = await fetch(`/api/orders/${orderId}/status`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ status: newStatus })
                });

                if (!res.ok) throw new Error("Could not update status");

                showToast(`Order #${orderId} marked as ${newStatus}!`, "success");
            } catch (err) {
                showToast("Failed to update status. Please try again.", "error");
            }
        }

        document.addEventListener("DOMContentLoaded", loadSellerOrders);
    </script>
</body>
</html>
