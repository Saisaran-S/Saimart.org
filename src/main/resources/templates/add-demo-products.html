<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Data Setup — Saimart</title>
    <link rel="stylesheet" href="/css/saimart.css">
    <style>
        .setup-container {
            max-width: 650px;
            margin: 60px auto;
            background: white;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            padding: 40px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }
    </style>
</head>
<body>

    <header class="saimart-nav">
        <div class="saimart-nav-inner">
            <a href="/" class="nav-brand">
                <span class="nav-brand-logo">SAIMART</span>
                <span class="nav-brand-badge">Demo Tool</span>
            </a>
            <div class="nav-actions" style="margin-left: auto;">
                <a href="/" class="nav-link">Home</a>
                <a href="/products" class="nav-link">Products</a>
            </div>
        </div>
    </header>

    <div class="setup-container">
        <div style="font-size: 56px; margin-bottom: 16px;">🚀</div>
        <h1 style="font-size: 26px; font-weight: 800; margin-bottom: 10px;">Seed Demo Products</h1>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px;">
            Instantly populate your Saimart database with high-quality electronics, fashion, gaming, and home products with HD images.
        </p>

        <button id="btnSeed" class="btn btn-primary" style="padding: 14px 28px; font-size: 15px;" onclick="triggerSeed()">
            ⚡ Populate 8 Verified Demo Products
        </button>

        <div id="seedStatus" style="margin-top: 20px; font-weight: 600; font-size: 14px;"></div>

        <div style="margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 20px;">
            <a href="/products" class="btn btn-outline" style="font-size: 13px;">View Product Catalogue →</a>
        </div>
    </div>

    <!-- SHARED JS CLIENT -->
    <script src="/js/saimart.js"></script>

    <script>
        async function triggerSeed() {
            const btn = document.getElementById("btnSeed");
            const status = document.getElementById("seedStatus");
            btn.disabled = true;
            btn.innerText = "Seeding Catalog...";
            status.innerHTML = "";

            try {
                const res = await fetch("/api/products/seed", { method: "POST" });
                const data = await res.json();
                status.innerHTML = `<span style="color: var(--success);">✓ ${data.message} (Total: ${data.count} items)</span>`;
                showToast("Products seeded successfully!", "success");
                setTimeout(() => {
                    window.location.href = "/products";
                }, 1000);
            } catch (err) {
                status.innerHTML = `<span style="color: var(--danger);">✕ Error seeding products.</span>`;
                btn.disabled = false;
                btn.innerText = "⚡ Populate 8 Verified Demo Products";
            }
        }
    </script>
</body>
</html>
