<!DOCTYPE html>
<html>
<head>
    <title>Add Demo Products - Saimart</title>
</head>
<body>

<h1>Add Demo Products</h1>

<button onclick="addProducts()">Add 4 Products</button>

<p id="message"></p>

<script>
async function addProduct(product) {

    const response = await fetch("/api/products", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(product)
    });

    return response.json();
}

async function addProducts() {

    const products = [

        {
            name: "Wireless Headphones",
            description: "High quality wireless headphones with clear sound.",
            category: "Electronics",
            price: 1499,
            stock: 20,
            imageUrl: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
        },

        {
            name: "Smart Watch",
            description: "Smart watch with fitness tracking and notifications.",
            category: "Electronics",
            price: 2499,
            stock: 15,
            imageUrl: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
        },

        {
            name: "Running Shoes",
            description: "Comfortable running shoes for everyday use.",
            category: "Fashion",
            price: 1999,
            stock: 25,
            imageUrl: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
        },

        {
            name: "Backpack",
            description: "Durable backpack for college and travel.",
            category: "Fashion",
            price: 899,
            stock: 30,
            imageUrl: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500"
        }
    ];

    for (const product of products) {
        await addProduct(product);
    }

    document.getElementById("message").innerText =
        "4 demo products added successfully!";
}
</script>

</body>
</html>
