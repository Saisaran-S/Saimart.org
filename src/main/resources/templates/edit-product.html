<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product — Saimart Seller Hub</title>
    <link rel="stylesheet" href="/css/saimart.css">
    <style>
        .form-wrapper {
            max-width: 680px;
            margin: 40px auto 70px;
            padding: 0 20px;
        }

        .form-card {
            background: white;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            padding: 36px;
            box-shadow: var(--shadow-sm);
        }

        .form-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .form-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .field-group {
            margin-bottom: 18px;
        }
        .field-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
        }
        .field-group input, .field-group textarea, .field-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }
        .field-group input:focus, .field-group textarea:focus, .field-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }
        .field-group textarea {
            height: 90px;
            resize: vertical;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .img-preview-box {
            margin-top: 10px;
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-sm);
            height: 160px;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .img-preview-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <header class="saimart-nav">
        <div class="saimart-nav-inner">
            <a href="/seller-dashboard" class="nav-brand">
                <span class="nav-brand-logo">SAIMART</span>
                <span class="nav-brand-badge">Edit Product</span>
            </a>
            <div class="nav-actions" style="margin-left: auto;">
                <a href="/my-products" class="nav-link">← Cancel & Back</a>
            </div>
        </div>
    </header>

    <div class="form-wrapper">
        <div class="form-card">
            <h1 class="form-title">Edit Product Details</h1>
            <p class="form-subtitle">Update pricing, stock availability, or description for your listing.</p>

            <form id="editForm" onsubmit="submitProductUpdate(event)">
                <div class="field-group">
                    <label>Product Name *</label>
                    <input type="text" id="name" required>
                </div>

                <div class="field-group">
                    <label>Category *</label>
                    <select id="category" required>
                        <option value="Electronics">Electronics</option>
                        <option value="Fashion">Fashion</option>
                        <option value="Gaming">Gaming</option>
                        <option value="Home">Home & Living</option>
                        <option value="Books">Books & Media</option>
                        <option value="Fitness">Fitness & Sports</option>
                    </select>
                </div>

                <div class="grid-2">
                    <div class="field-group">
                        <label>Price (₹) *</label>
                        <input type="number" id="price" min="1" step="0.01" required>
                    </div>
                    <div class="field-group">
                        <label>Stock Quantity *</label>
                        <input type="number" id="stock" min="0" step="1" required>
                    </div>
                </div>

                <div class="field-group">
                    <label>Description</label>
                    <textarea id="description"></textarea>
                </div>

                <div class="field-group">
                    <label>Product Image URL</label>
                    <input type="url" id="imageUrl" oninput="updatePreview(this.value)">
                    <div class="img-preview-box" id="previewBox">
                        <span style="color: var(--text-muted); font-size: 13px;">Image preview</span>
                    </div>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <a href="/my-products" class="btn btn-outline" style="flex: 1; padding: 13px;">Cancel</a>
                    <button type="submit" id="btnSave" class="btn btn-primary" style="flex: 1; padding: 13px;">
                        Save Changes ✓
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- SHARED JS CLIENT -->
    <script src="/js/saimart.js"></script>

    <script>
        const productId = new URLSearchParams(window.location.search).get("id");

        function updatePreview(url) {
            const box = document.getElementById("previewBox");
            if (url && url.trim().startsWith("http")) {
                box.innerHTML = `<img src="${url}" alt="Preview" onerror="this.parentElement.innerHTML='<span style=\\'color:var(--danger);font-size:13px;\\'>✕ Invalid image link</span>'">`;
            } else {
                box.innerHTML = `<span style="color: var(--text-muted); font-size: 13px;">Image preview</span>`;
            }
        }

        async function loadProductData() {
            if (!productId) {
                showToast("Product ID not found", "error");
                setTimeout(() => window.location.href = "/my-products", 1000);
                return;
            }

            try {
                const res = await fetch("/api/products/" + productId);
                if (!res.ok) throw new Error("Could not find product");

                const product = await res.json();
                document.getElementById("name").value = product.name || "";
                document.getElementById("category").value = product.category || "Electronics";
                document.getElementById("price").value = product.price || 0;
                document.getElementById("stock").value = product.stock != null ? product.stock : 0;
                document.getElementById("description").value = product.description || "";
                document.getElementById("imageUrl").value = product.imageUrl || "";

                updatePreview(product.imageUrl);

            } catch (err) {
                showToast("Failed to load product details", "error");
            }
        }

        async function submitProductUpdate(e) {
            e.preventDefault();

            const btn = document.getElementById("btnSave");
            btn.disabled = true;
            btn.innerText = "Saving Changes...";

            const payload = {
                name: document.getElementById("name").value.trim(),
                category: document.getElementById("category").value,
                price: parseFloat(document.getElementById("price").value),
                stock: parseInt(document.getElementById("stock").value),
                description: document.getElementById("description").value.trim(),
                imageUrl: document.getElementById("imageUrl").value.trim()
            };

            try {
                const res = await fetch("/api/products/" + productId, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error("Failed to save changes");

                showToast("Product updated successfully! ✓", "success");
                setTimeout(() => {
                    window.location.href = "/my-products";
                }, 500);

            } catch (err) {
                showToast("Could not update product.", "error");
                btn.disabled = false;
                btn.innerText = "Save Changes ✓";
            }
        }

        document.addEventListener("DOMContentLoaded", loadProductData);
    </script>
</body>
</html>
