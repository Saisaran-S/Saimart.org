<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Saimart</title>
    <link rel="stylesheet" href="/css/saimart.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            background: white;
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-lg);
        }

        .auth-logo {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            color: var(--accent-hover);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 26px;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .auth-footer a {
            color: var(--accent-hover);
            font-weight: 700;
            text-decoration: none;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-logo">SAIMART</div>
        <div class="auth-subtitle">Join Saimart as a Buyer or Verified Merchant</div>

        <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="name" placeholder="John Doe" required autocomplete="name">
            </div>

            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" id="email" placeholder="name@example.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label>Account Type *</label>
                <select id="role" required>
                    <option value="BUYER">🛍️ Buyer (Shop, cart, and track orders)</option>
                    <option value="SELLER">🏪 Seller (List products and manage orders)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Password *</label>
                <input type="password" id="password" placeholder="At least 6 characters" required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label>Confirm Password *</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter password" required autocomplete="new-password">
            </div>

            <button type="submit" id="btnSignup" class="btn btn-primary" style="width: 100%; padding: 13px; font-size: 15px; margin-top: 10px;">
                Create Account
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="/login">Sign In</a>
            <div style="margin-top: 10px;">
                <a href="/" style="color: var(--text-muted); font-size: 12px;">← Back to Home</a>
            </div>
        </div>
    </div>

    <!-- SHARED JS CLIENT -->
    <script src="/js/saimart.js"></script>

    <script>
        async function handleSignup(e) {
            e.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const role = document.getElementById("role").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                showToast("Passwords do not match!", "warning");
                return;
            }

            if (password.length < 4) {
                showToast("Password should be at least 4 characters long", "warning");
                return;
            }

            const btn = document.getElementById("btnSignup");
            btn.disabled = true;
            btn.innerText = "Creating account...";

            try {
                const res = await fetch("/api/users/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, role, password })
                });

                const text = await res.text();

                if (text === "Email already registered") {
                    showToast("This email is already registered. Please sign in.", "warning");
                    btn.disabled = false;
                    btn.innerText = "Create Account";
                    return;
                }

                if (text.includes("successfully") || res.ok) {
                    showToast("Account created successfully! Redirecting to login...", "success");
                    setTimeout(() => {
                        window.location.href = "/login";
                    }, 800);
                } else {
                    throw new Error(text || "Could not register account");
                }

            } catch (err) {
                console.error(err);
                showToast(err.message || "Failed to create account. Please try again.", "error");
                btn.disabled = false;
                btn.innerText = "Create Account";
            }
        }
    </script>
</body>
</html>
