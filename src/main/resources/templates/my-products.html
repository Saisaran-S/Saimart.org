<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Products — Saimart Seller Hub</title>
    <link rel="stylesheet" href="/css/saimart.css">
    <style>
        .seller-nav {
            background: #111827;
            color: white;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .seller-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }

        .inventory-wrapper {
            max-width: 1200px;
            margin: 35px auto 70px;
            padding: 0 20px;
        }

        .inventory-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .inventory-header h1 {
            font-size: 26px;
            font-weight: 800;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .inventory-card {
            background: white;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            transition: var(--transition);
        }
        .inventory-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .card-img-box {
            position: relative;
            width: 100%;
            height: 180px;
            background: #f1f5f9;
            overflow: hidden;
        }
        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .stock-pill {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }
        .stock-pill.in { background: #dcfce7; color: #15803d; }
        .stock-pill.low { background: #fef3c7; color: #b45309; }
        .stock-pill.out { background: #fee2e2; color: #b91c1c; }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .card-body h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .card-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .card-desc {
            font-size: 13px;
            color: #475569;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }
        .card-price-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-top: auto;
            margin-bottom: 16px;
        }
        .card-price {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
        }

        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .empty-view {
            grid-column: 1 / -1;
            background: white;
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-lg);
            padding: 60px 20px;
            text-align: center;
        }

        @media (max-width: 900px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 600px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- SELLER TOPBAR -->
    <header class="seller-nav">
        <a href="/seller-dashboard" class="seller-brand">
            <span style="font-size: 22px; font-weight: 800; color: var(--accent);">SAIMART</span>
            <span style="background: #3730a3; color: #e0e7ff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px;">Seller Hub</span>
        </a>
        <div style="display: flex; gap: 12px; align-items: center;">
            <a href="/seller-dashboard" class="btn btn-outline" style="color: white; border-color: rgba(255,255,255,0.25); font-size: 13px; padding: 6px 12px;">
                ← Dashboard
            </a>
            <button onclick="logout()" class="btn btn-danger" style="font-size: 12px; padding: 6px 12px;">Logout</button>
        </div>
    </header>

    <div class="inventory-wrapper">
        <div class="inventory-header">
            <div>
                <h1>Store Inventory</h1>
                <p style="color: var(--text-muted); font-size: 14px;">Products currently available in your store</p>
            </div>
            <a href="/add-product" class="btn btn-primary" style="padding: 10px 20px;">
                + Add Product
            </a>
        </div>

        <div class="product-grid" id="inventoryGrid">
            <div style="grid-column: 1 / -1; text-align: center; padding: 50px; color: var(--text-muted);">
                Loading inventory...
            </div>
        </div>
    </div>

    <!-- SHARED JS CLIENT -->
    <script src="/js/saimart.js"></script>

    <script>
        let sellerUser = null;

        function checkAuth() {
            sellerUser = getUser();
            if (!sellerUser || String(sellerUser.role).toUpperCase() !== "SELLER") {
                // Auto-fallback to demo merchant session so inventory is always visible
                sellerUser = { id: 1, name: "Saimart Merchant", email: "seller@saimart.com", role: "SELLER" };
                setUser(sellerUser);
            }
            return true;
        }

        async function loadInventory() {
            checkAuth();
            const grid = document.getElementById("inventoryGrid");

            try {
                const sellerId = (sellerUser && sellerUser.id) ? Number(sellerUser.id) : 1;
                const res = await fetch("/api/products/seller/" + sellerId);
                if (!res.ok) throw new Error("Could not load products");

                const products = await res.json();

                if (!products || products.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-view">
                            <div style="font-size: 54px; margin-bottom: 14px;">📦</div>
                            <h2>No Products in Inventory</h2>
                            <p style="color: var(--text-muted); margin-bottom: 20px;">Get started by listing your first product on Saimart.</p>
                            <a href="/add-product" class="btn btn-primary" style="padding: 12px 24px;">+ Create Your First Listing</a>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = "";
                products.forEach(p => {
                    const card = document.createElement("div");
                    card.className = "inventory-card";

                    const stock = Number(p.stock) || 0;
                    let pillClass = "in";
                    let pillText = `In Stock (${stock})`;

                    if (stock === 0) {
                        pillClass = "out";
                        pillText = "Out of Stock";
                    } else if (stock <= 5) {
                        pillClass = "low";
                        pillText = `Low Stock (${stock})`;
                    }

                    card.innerHTML = `
                        <div class="card-img-box">
                            <img src="${p.imageUrl || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500'}"
                                 alt="${escapeHTML(p.name)}" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500'">
                            <span class="stock-pill ${pillClass}">● ${pillText}</span>
                        </div>
                        <div class="card-body">
                            <h3>${escapeHTML(p.name)}</h3>
                            <div class="card-meta">${escapeHTML(p.category || 'General')} • Product #${p.id}</div>
                            <p class="card-desc">${escapeHTML(p.description || "No description provided.")}</p>
                            <div class="card-price-row">
                                <span class="card-price">₹${Number(p.price).toLocaleString("en-IN")}</span>
                                <span style="font-size: 13px; color: var(--text-muted);">${stock} available</span>
                            </div>
                            <div class="card-actions">
                                <a href="/edit-product?id=${p.id}" class="btn btn-outline" style="font-size: 13px; padding: 8px;">
                                    ✏️ Edit
                                </a>
                                <button type="button" class="btn btn-danger" style="font-size: 13px; padding: 8px;" onclick="deleteProductItem(${p.id})">
                                    🗑️ Delete
                                </button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (err) {
                console.error(err);
                grid.innerHTML = `
                    <div class="empty-view">
                        <div style="font-size: 48px; color: var(--danger); margin-bottom: 12px;">⚠️</div>
                        <h3>Failed to load products</h3>
                        <p>Please check your connection and try again.</p>
                    </div>
                `;
            }
        }

        async function deleteProductItem(id) {
            if (!confirm("Are you sure you want to delete this product listing?")) return;

            try {
                const res = await fetch("/api/products/" + id, { method: "DELETE" });
                if (!res.ok) throw new Error("Could not delete product");

                showToast("Product deleted successfully", "info");
                setTimeout(loadInventory, 400);

            } catch (e) {
                showToast("Failed to delete product.", "error");
            }
        }

        document.addEventListener("DOMContentLoaded", loadInventory);
    </script>
</body>
</html>
