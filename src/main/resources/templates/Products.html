<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saimart - Products</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f5f5;
        }

        /* NAVBAR */
        .navbar {
            background: #131921;
            color: white;
            padding: 12px 6%;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #ff9900;
            white-space: nowrap;
        }

        /* SEARCH BAR */
        .search {
            flex: 1;
            display: flex;
            max-width: 650px;
        }

        .search input {
            width: 100%;
            padding: 12px;
            border: none;
            outline: none;
            font-size: 15px;
            border-radius: 5px 0 0 5px;
        }

        .search button {
            padding: 12px 20px;
            border: none;
            background: #ff9900;
            cursor: pointer;
            font-weight: bold;
            border-radius: 0 5px 5px 0;
        }

        /* NAV LINKS */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-left: auto;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-links a:hover {
            color: #ff9900;
        }

        /* CONTENT */
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        h1 {
            margin-bottom: 20px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            border-radius: 5px;
        }

        .product-card h3 {
            margin-bottom: 8px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        .stock {
            color: green;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            background: #ff9900;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        #message {
            margin-bottom: 20px;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 10px;
            grid-column: 1 / -1;
        }

        /* MOBILE */
        @media (max-width: 800px) {

            .navbar {
                flex-wrap: wrap;
            }

            .search {
                order: 3;
                flex-basis: 100%;
                max-width: none;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        Saimart
    </div>

    <!-- SEARCH BAR -->
    <div class="search">

        <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
        >

        <button onclick="searchProducts()">
            Search
        </button>

    </div>

    <div class="nav-links">

        <a href="/products">
            Products
        </a>

        <a href="/cart">
            🛒 Cart
        </a>

        <a href="/login">
            Logout
        </a>

    </div>

</nav>


<div class="container">

    <h1>Products</h1>

    <div id="message"></div>

    <div
        class="products"
        id="productsContainer">
    </div>

</div>


<script>

let allProducts = [];


/* LOAD PRODUCTS */

async function loadProducts() {

    try {

        const response =
            await fetch("/api/products");

        const products =
            await response.json();

        allProducts = products;

        displayProducts(products);

    } catch (error) {

        document.getElementById("message").innerText =
            "Unable to load products.";

        console.error(error);
    }
}


/* DISPLAY PRODUCTS */

function displayProducts(products) {

    const container =
        document.getElementById("productsContainer");

    const message =
        document.getElementById("message");

    container.innerHTML = "";

    if (!products || products.length === 0) {

        message.innerText = "";

        container.innerHTML = `
            <div class="no-results">
                <h3>No products found</h3>
                <p>Try searching for another product.</p>
            </div>
        `;

        return;
    }

    message.innerText =
        products.length + " product(s) found";


    products.forEach(product => {

        const card =
            document.createElement("div");

        card.className =
            "product-card";

        card.innerHTML = `

            <img
                src="${product.imageUrl || ''}"
                alt="${product.name}"
                onerror="this.style.display='none'"
            >

            <h3
                onclick="viewProduct(${product.id})"
                style="cursor:pointer">

                ${product.name}

            </h3>

            <p>
                ${product.description || ""}
            </p>

            <div class="price">
                ₹${Number(product.price).toLocaleString("en-IN")}
            </div>

            <p class="stock">
                Stock: ${product.stock}
            </p>

            <button
                onclick="addToCart(${product.id})">

                Add to Cart

            </button>

        `;

        container.appendChild(card);

    });
}


/* SEARCH */

function searchProducts() {

    const query =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();


    if (!query) {

        displayProducts(allProducts);

        return;
    }


    const filteredProducts =
        allProducts.filter(product =>

            (product.name || "")
                .toLowerCase()
                .includes(query)

            ||

            (product.description || "")
                .toLowerCase()
                .includes(query)

            ||

            (product.category || "")
                .toLowerCase()
                .includes(query)

        );


    displayProducts(filteredProducts);

}


/* SEARCH WHEN PRESSING ENTER */

document
    .getElementById("searchInput")
    .addEventListener("keyup", function(event) {

        if (event.key === "Enter") {

            searchProducts();

        }

    });


/* ADD TO CART */

function addToCart(productId) {

    fetch("/api/products/" + productId)

        .then(response => response.json())

        .then(product => {

            let cart =
                JSON.parse(
                    localStorage.getItem("saimartCart")
                ) || [];


            const existingProduct =
                cart.find(
                    item => item.id === product.id
                );


            if (existingProduct) {

                existingProduct.quantity++;

            } else {

                cart.push({

                    id: product.id,

                    name: product.name,

                    description: product.description,

                    price: product.price,

                    imageUrl: product.imageUrl,

                    quantity: 1

                });

            }


            localStorage.setItem(
                "saimartCart",
                JSON.stringify(cart)
            );


            alert("Product added to cart!");

        })

        .catch(error => {

            console.error(error);

            alert(
                "Unable to add product to cart."
            );

        });

}


/* PRODUCT DETAILS */

function viewProduct(id) {

    window.location.href =
        "/product-details?id=" + id;

}


/* START */

loadProducts();

</script>

</body>
</html>
