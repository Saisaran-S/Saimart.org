<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saimart - Products</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f5f5;
        }

        .navbar {
            background: #131921;
            color: white;
            padding: 16px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        h1 {
            margin-bottom: 20px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            border-radius: 5px;
        }

        .product-card h3 {
            margin-bottom: 8px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        .stock {
            color: green;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            background: #ff9900;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        #message {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<nav class="navbar">

    <div class="logo">Saimart</div>

    <div class="nav-links">
        <a href="/products">Products</a>
        <a href="/cart">Cart</a>
        <a href="/login">Logout</a>
    </div>

</nav>

<div class="container">

    <h1>Products</h1>

    <div id="message"></div>

    <div class="products" id="productsContainer">
    </div>

</div>

<script>

async function loadProducts() {

    try {

        const response = await fetch("/api/products");

        const products = await response.json();

        const container =
            document.getElementById("productsContainer");

        container.innerHTML = "";

        if (products.length === 0) {

            document.getElementById("message").innerText =
                "No products available yet.";

            return;
        }

        products.forEach(product => {

            const card = document.createElement("div");

            card.className = "product-card";

            card.innerHTML = `

                <img src="${product.imageUrl}"
                     alt="${product.name}">

                <h3 onclick="viewProduct(${product.id})"
    style="cursor:pointer">
    ${product.name}
</h3>

                <p>${product.description}</p>

                <div class="price">
                    ₹${product.price}
                </div>

                <p class="stock">
                    Stock: ${product.stock}
                </p>

                <button onclick="addToCart(${product.id})">
                    Add to Cart
                </button>

            `;

            container.appendChild(card);

        });

    } catch (error) {

        document.getElementById("message").innerText =
            "Unable to load products.";

        console.error(error);
    }
}

function addToCart(productId) {

    fetch("/api/products/" + productId)
        .then(response => response.json())
        .then(product => {

            let cart =
                JSON.parse(localStorage.getItem("saimartCart")) || [];

            const existingProduct =
                cart.find(item => item.id === product.id);

            if (existingProduct) {

                existingProduct.quantity++;

            } else {

                cart.push({
                    id: product.id,
                    name: product.name,
                    description: product.description,
                    price: product.price,
                    imageUrl: product.imageUrl,
                    quantity: 1
                });
            }

            localStorage.setItem(
                "saimartCart",
                JSON.stringify(cart)
            );

            alert("Product added to cart!");

        })
        .catch(error => {
            console.error(error);
            alert("Unable to add product to cart.");
        });
}
function viewProduct(id) {
    window.location.href = "/product-details?id=" + id;
}
loadProducts();

</script>

</body>
</html>
