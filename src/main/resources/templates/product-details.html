<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details - Saimart</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f5f5;
        }

        .navbar {
            background: #131921;
            color: white;
            padding: 16px 6%;
            display: flex;
            justify-content: space-between;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .product {
            background: white;
            padding: 30px;
            border-radius: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .product img {
            width: 100%;
            height: 350px;
            object-fit: contain;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0;
        }

        button {
            padding: 14px 25px;
            background: #ff9900;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        @media(max-width: 700px) {
            .product {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">

    <strong>Saimart</strong>

    <div>
        <a href="/products">Products</a>
        <a href="/cart">Cart</a>
    </div>

</nav>

<div class="container">

    <div class="product" id="productContainer">
        Loading...
    </div>

</div>

<script>

const productId =
    new URLSearchParams(window.location.search).get("id");

async function loadProduct() {

    const response =
        await fetch("/api/products/" + productId);

    const product = await response.json();

    document.getElementById("productContainer").innerHTML = `

        <div>
            <img src="${product.imageUrl}"
                 alt="${product.name}">
        </div>

        <div>

            <h1>${product.name}</h1>

            <p>${product.description}</p>

            <p><strong>Category:</strong>
                ${product.category}
            </p>

            <div class="price">
                ₹${product.price}
            </div>

            <p>
                <strong>Available Stock:</strong>
                ${product.stock}
            </p>

            <button onclick="addToCart(${product.id})">
                Add to Cart
            </button>

        </div>
    `;
}

function addToCart(id) {

    alert("Product added to cart!");

}

loadProduct();

</script>

</body>
</html>
